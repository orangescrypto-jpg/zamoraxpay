name: Fetch VTpass Plans

# Run manually from the Actions tab whenever you need a fresh dump of
# VTpass's plan codes and pricing — no schedule, since this is just a
# one-off lookup tool, not something that needs to run automatically.
on:
  workflow_dispatch:

jobs:
  fetch-plans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run VTpass plan fetch script
        env:
          VTPASS_API_KEY: ${{ secrets.VTPASS_API_KEY }}
          VTPASS_SECRET_KEY: ${{ secrets.VTPASS_SECRET_KEY }}
          VTPASS_PUBLIC_KEY: ${{ secrets.VTPASS_PUBLIC_KEY }}
          VTPASS_BASE_URL: ${{ secrets.VTPASS_BASE_URL }}
        run: node fetch-vtpass-plans.mjs
